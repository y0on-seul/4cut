
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTRL + SMILE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #ffffff;
            --frame-color: #ffffff;
            --text-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.8em;
            text-transform: uppercase;
        }

        main {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Camera Section */
        .camera-wrapper {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #111;
            border-radius: 30px;
            border: 2px solid var(--accent-color);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .countdown {
            position: absolute;
            font-size: 6rem;
            font-weight: 700;
            display: none;
            z-index: 10;
        }

        .flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes flash-anim {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Controls */
        .controls {
            margin-top: 40px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shutter {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid white;
            background: transparent;
            padding: 5px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .shutter:active { transform: scale(0.9); }

        .shutter-inner {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
        }

        /* Result Section */
        #result-view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .frame-container {
            width: 320px;
            background-color: var(--frame-color);
            padding: 15px 15px 35px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            color: var(--text-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .photo-box {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #eee;
            overflow: hidden;
            position: relative;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .sticker {
            position: absolute;
            width: 40%;
            pointer-events: none;
        }

        .sticker-tl { top: -5%; left: -5%; transform: rotate(-15deg); }
        .sticker-br { bottom: -5%; right: -5%; transform: rotate(15deg); }

        .footer {
            margin-top: 15px;
            text-align: center;
        }

        .footer-logo {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.2em;
        }

        .footer-date {
            font-size: 0.6rem;
            margin-top: 4px;
            opacity: 0.7;
        }

        /* Custom UI */
        .custom-ui {
            margin-top: 30px;
            width: 100%;
            background: #111;
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .colors {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .color-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-dot.active { border-color: #007aff; }

        .upload-btn {
            background: #222;
            color: white;
            padding: 12px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        #final-image {
            width: 100%;
            max-width: 320px;
            margin-bottom: 20px;
            display: none;
        }

        .reset-btn {
            margin-top: 20px;
            color: #888;
            background: none;
            border: none;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>CTRL + SMILE</h1>
</header>

<main>
    <div id="camera-view" style="width:100%; display: flex; flex-direction: column; align-items: center;">
        <div class="camera-wrapper">
            <video id="webcam" autoplay playsinline></video>
            <div id="countdown" class="countdown">3</div>
            <div id="flash" class="flash"></div>
        </div>
        <div class="controls">
            <button class="shutter" id="startBtn">
                <div class="shutter-inner"></div>
            </button>
        </div>
    </div>

    <div id="result-view">
        <div id="capture-area">
            <div class="frame-container" id="main-frame">
                <div class="grid">
                    <div class="photo-box" id="slot-0"></div>
                    <div class="photo-box" id="slot-1"></div>
                    <div class="photo-box" id="slot-2"></div>
                    <div class="photo-box" id="slot-3"></div>
                </div>
                <div class="footer">
                    <div class="footer-logo">CTRL + SMILE</div>
                    <div class="footer-date" id="current-date"></div>
                </div>
            </div>
        </div>

        <img id="final-image" alt="Long press to save">

        <div class="custom-ui">
            <div class="colors">
                <div class="color-dot active" style="background:#fff" onclick="setFrame('#ffffff','#000',this)"></div>
                <div class="color-dot" style="background:#000; border:1px solid #333" onclick="setFrame('#000','#fff',this)"></div>
                <div class="color-dot" style="background:#ffc0cb" onclick="setFrame('#ffc0cb','#000',this)"></div>
                <div class="color-dot" style="background:#a0e9ff" onclick="setFrame('#a0e9ff','#000',this)"></div>
                <div class="color-dot" style="background:#d1ffbd" onclick="setFrame('#d1ffbd','#000',this)"></div>
            </div>
            <label class="upload-btn">
                스티커 이미지 업로드
                <input type="file" id="stickerInput" hidden accept="image/*">
            </label>
        </div>

        <button class="reset-btn" onclick="location.reload()">다시 시작하기</button>
    </div>
</main>

<script>
    const video = document.getElementById('webcam');
    const startBtn = document.getElementById('startBtn');
    const countdownEl = document.getElementById('countdown');
    const flashEl = document.getElementById('flash');
    const cameraView = document.getElementById('camera-view');
    const resultView = document.getElementById('result-view');
    const stickerInput = document.getElementById('stickerInput');
    
    let photos = [];
    let stickerSrc = null;

    // Start Camera
    async function init() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { aspectRatio: 3/4 }, audio: false });
        video.srcObject = stream;
    }

    startBtn.onclick = async () => {
        startBtn.style.visibility = 'hidden';
        for (let i = 0; i < 4; i++) {
            await countdown(3);
            takePhoto(i);
            doFlash();
            await new Promise(r => setTimeout(r, 600));
        }
        showResults();
    };

    function countdown(sec) {
        return new Promise(resolve => {
            let count = sec;
            countdownEl.style.display = 'block';
            countdownEl.innerText = count;
            let timer = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(timer);
                    countdownEl.style.display = 'none';
                    resolve();
                } else {
                    countdownEl.innerText = count;
                }
            }, 1000);
        });
    }

    function takePhoto(index) {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0);
        const data = canvas.toDataURL('image/jpeg');
        photos.push(data);
        document.getElementById(`slot-${index}`).innerHTML = `<img src="${data}">`;
    }

    function doFlash() {
        flashEl.style.animation = 'none';
        flashEl.offsetHeight;
        flashEl.style.animation = 'flash-anim 0.4s ease-out';
    }

    function showResults() {
        cameraView.style.display = 'none';
        resultView.style.display = 'flex';
        document.getElementById('current-date').innerText = new Date().toLocaleDateString();
        renderFinal();
    }

    function setFrame(bg, txt, el) {
        const frame = document.getElementById('main-frame');
        frame.style.backgroundColor = bg;
        frame.style.color = txt;
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        el.classList.add('active');
        renderFinal();
    }

    stickerInput.onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (event) => {
            stickerSrc = event.target.result;
            applyStickers();
            renderFinal();
        };
        reader.readAsDataURL(file);
    };

    function applyStickers() {
        const s0 = document.getElementById('slot-0');
        const s3 = document.getElementById('slot-3');
        // Clear previous
        s0.querySelectorAll('.sticker').forEach(s => s.remove());
        s3.querySelectorAll('.sticker').forEach(s => s.remove());
        
        const img1 = document.createElement('img');
        img1.src = stickerSrc;
        img1.className = 'sticker sticker-tl';
        s0.appendChild(img1);

        const img2 = document.createElement('img');
        img2.src = stickerSrc;
        img2.className = 'sticker sticker-br';
        s3.appendChild(img2);
    }

    function renderFinal() {
        const area = document.getElementById('capture-area');
        const finalImg = document.getElementById('final-image');
        html2canvas(area, { scale: 3 }).then(canvas => {
            finalImg.src = canvas.toDataURL('image/png');
            finalImg.style.display = 'block';
            area.style.display = 'none'; // Hide source, show render
        });
    }

    init();
</script>
</body>
</html>
